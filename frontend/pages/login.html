<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập - Grade Smart AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed": "#dde1ff",
                      "on-tertiary-fixed-variant": "#004883",
                      "surface-container-highest": "#e0e3e5",
                      "on-secondary-fixed": "#0e1d2b",
                      "on-primary-fixed-variant": "#173bab",
                      "surface-tint": "#3755c3",
                      "secondary-fixed": "#d5e4f8",
                      "surface-container-high": "#e6e8ea",
                      "on-tertiary-container": "#8fbeff",
                      "on-secondary": "#ffffff",
                      "surface-dim": "#d8dadc",
                      "surface-variant": "#e0e3e5",
                      "secondary-container": "#d5e4f8",
                      "tertiary-container": "#004c8b",
                      "surface": "#f7f9fb",
                      "on-error": "#ffffff",
                      "background": "#f7f9fb",
                      "on-secondary-fixed-variant": "#3a4858",
                      "inverse-primary": "#b8c4ff",
                      "tertiary-fixed-dim": "#a4c9ff",
                      "on-background": "#191c1e",
                      "surface-container-low": "#f2f4f6",
                      "primary": "#00288e",
                      "secondary": "#516070",
                      "on-primary": "#ffffff",
                      "error": "#ba1a1a",
                      "on-surface-variant": "#444653",
                      "tertiary": "#003564",
                      "surface-bright": "#f7f9fb",
                      "on-surface": "#191c1e",
                      "outline-variant": "#c4c5d5",
                      "on-tertiary-fixed": "#001c39",
                      "on-error-container": "#93000a",
                      "tertiary-fixed": "#d4e3ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "xl": "2rem",
                      "lg": "1.5rem",
                      "sm": "0.5rem",
                      "gutter": "1.5rem",
                      "2xl": "3rem",
                      "container-max": "1280px",
                      "xs": "0.25rem",
                      "md": "1rem",
                      "base": "4px"
              },
              "fontFamily": {
                      "body-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "label-md": ["Inter"],
                      "h1": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-sm": ["Inter"],
                      "h3": ["Inter"],
                      "h2": ["Inter"]
              },
              "fontSize": {
                      "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "label-md": ["14px", {"lineHeight": "1", "fontWeight": "500"}],
                      "h1": ["36px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "1", "fontWeight": "600"}],
                      "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "h2": ["30px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}]
              }
            },
          },
        }
      </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
        .bg-gradient-mesh {
            background-color: #f7f9fb;
            background-image: radial-gradient(at 0% 0%, #dde1ff 0, transparent 50%), 
                              radial-gradient(at 100% 100%, #d4e3ff 0, transparent 50%);
        }
      </style>
</head>
<body class="bg-gradient-mesh min-h-screen flex flex-col font-body-md text-on-surface">
<!-- TopNavBar Alignment (Visual only, no nav for focused login) -->
<header class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm px-6 py-3 md:px-12 flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">school</span>
<span class="text-xl font-bold text-blue-800 tracking-tight">Grade Smart</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-gutter mt-16">
<div class="w-full max-auto max-w-[480px]">
<!-- Login Card -->
<div class="glass-card rounded-xl p-8 md:p-10 shadow-lg border border-outline-variant">
<div class="text-center mb-8">
<h1 class="font-h2 text-h2 text-primary mb-2">Đăng nhập</h1>
<p class="font-body-sm text-on-surface-variant">Vui lòng đăng nhập để tiếp tục sử dụng dịch vụ</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-on-surface flex items-center gap-2" for="username">
<span class="material-symbols-outlined text-[18px]">person</span>
                            Tên đăng nhập
                        </label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md" id="username" placeholder="nhập tên đăng nhập" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[18px]">lock</span>
                                Mật khẩu
                            </label>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md" id="password" placeholder="••••••••" type="password"/>
<button id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-3.5 rounded-lg font-label-md hover:bg-blue-800 transition-all active:scale-[0.98] shadow-md" type="submit">
                        Đăng nhập
                    </button>
</form>
<!-- Quick Access Section -->
<div class="mt-8 space-y-6">
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<span class="relative px-4 bg-transparent text-label-sm text-on-surface-variant uppercase tracking-wider">Hoặc đăng nhập nhanh với:</span>
</div>
<div class="grid grid-cols-2 gap-4">
<button id="userBtn" class="flex items-center justify-center gap-2 border border-primary text-primary py-3 rounded-lg hover:bg-blue-50 transition-colors font-label-md">
<span class="material-symbols-outlined text-[20px]">person</span>
                            Người dùng
                        </button>
<button class="flex items-center justify-center gap-2 bg-slate-800 text-white py-3 rounded-lg hover:bg-slate-900 transition-colors font-label-md">
<span class="material-symbols-outlined text-[20px]">shield</span>
                            Quản trị viên
                        </button>
</div>
</div>
<div class="mt-8 text-center">
<p class="font-body-sm text-on-surface-variant">Chưa có tài khoản? <a class="text-primary font-semibold hover:underline" href="#">Đăng ký ngay</a></p>
</div>
</div>
</div>
</main>
<!-- Footer -->
<!-- Decorative Elements (Optional for enterprise style) -->
<div class="fixed top-[20%] right-[10%] -z-10 w-64 h-64 bg-blue-100/30 rounded-full blur-3xl"></div>
<div class="fixed bottom-[10%] left-[5%] -z-10 w-96 h-96 bg-indigo-100/20 rounded-full blur-3xl"></div>
<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
</body></html>
